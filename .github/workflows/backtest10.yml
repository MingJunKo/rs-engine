name: 10-year backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "History to test (yfinance period, e.g. 10y, 5y)"
        required: false
        default: "10y"

permissions:
  contents: write

concurrency:
  group: rs-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest10.py ${{ inputs.years }}
      - name: Commit
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add docs/backtest data/backtest10.json
          git diff --cached --quiet || git commit -m "10-year backtest $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
