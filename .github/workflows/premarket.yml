name: Pre-market EP

on:
  schedule:
    # Two slots so one lands in the pre-market window in both EST and EDT; the script only acts
    # between 8:00 and 9:29 New York time, once per day.
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the pre-market window"
        type: boolean
        default: false
      dry:
        description: "Diagnostics only (no Telegram, no file)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan pre-market
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python premarket.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry' || '' }}
      - name: Commit
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add docs/data/premarket.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Pre-market EP $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
