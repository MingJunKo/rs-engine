name: Pre-market EP

on:
  schedule:
    # Two slots so one lands in the pre-market window in both EST and EDT; the script only acts
    # between 8:00 and 9:29 New York time, once per day.
    # GitHub's scheduler can run late or skip a slot, so there are several; the script acts once per day,
    # only between 8:00 and 9:29 New York (12–13 UTC in summer time, 13–14 UTC in winter)
    - cron: "5,25,45 12 * * 1-5"
    - cron: "5,25,45 13 * * 1-5"
    - cron: "5 14 * * 1-5"
    # A-list pivot check ~15 min after the open (9:45 New York in winter, 10:45 in summer; script acts 9:35–11:00)
    - cron: "45 14 * * 1-5"
    - cron: "50 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the pre-market window"
        type: boolean
        default: false
      dry:
        description: "Diagnostics only (no Telegram, no file)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan pre-market
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python premarket.py ${{ (github.event.schedule == '45 14 * * 1-5' || github.event.schedule == '50 13 * * 1-5') && '--open' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry' || '' }}
      - name: Commit
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          for f in docs/data/premarket.json docs/data/tradingview_premarket.txt docs/data/pivot_open.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "Pre-market EP $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
