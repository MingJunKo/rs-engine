name: VPA practice reminder

on:
  schedule:
    - cron: "53 11 * * *"   # ~8pm Singapore: daily reminder with stats
    - cron: "47 14 * * *"   # ~11pm Singapore: last call, only if today's goal is not met
  workflow_dispatch:
    inputs:
      last_call:
        description: "Send the last-call version"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Send reminder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPA_GIST_ID: ${{ secrets.VPA_GIST_ID }}
        run: python vpa_reminder.py ${{ (github.event.schedule == '47 14 * * *' || inputs.last_call) && '--last-call' || '' }}
