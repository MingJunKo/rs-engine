name: RS Engine

on:
  schedule:
    # 22:30 UTC Mon–Fri = 6:30am SGT Tue–Sat, after the US close.
    # The Saturday-morning run (Friday close) also sends the Telegram summary.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      notify:
        description: "Send the Telegram summary now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rs-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.notify }}
        run: python rs_engine.py
      - name: Commit dashboard and history
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add docs data config
          git diff --cached --quiet || git commit -m "RS update $(date -u +%Y-%m-%d)"
          git push
