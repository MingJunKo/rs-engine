name: RS Engine

on:
  # Started by a Claude scheduled task at 7:45am SGT Tue–Sat (GitHub's own schedule ran hours late and
  # sent a second Telegram brief). Run it by hand from the Actions tab if a morning is missed.
  workflow_dispatch:
    inputs:
      notify:
        description: "Send the Telegram summary now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rs-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.notify }}
        run: python rs_engine.py
      - name: Commit dashboard and history
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add docs data config
          git diff --cached --quiet || git commit -m "RS update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -X theirs
          git push
