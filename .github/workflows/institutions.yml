name: Institutions (13F)

on:
  schedule:
    # 6th of each month. Does nothing unless the SEC has published a new 13F data set
    # (they appear a few weeks after each filing window ends: Mar, Jun, Sep, Dec).
    - cron: "0 3 6 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build 13F holder counts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
        run: python institutions.py
      - name: Commit
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add data/institutions.csv data/inst
          git diff --cached --quiet || git commit -m "13F holders $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
