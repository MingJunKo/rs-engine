name: Insider purchases (backfill)

# The daily engine run reads new Form 4 filings itself; use this to backfill or test.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Business days to read"
        default: "7"

permissions:
  contents: write

concurrency:
  group: rs-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read Form 4 filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python insiders.py --days ${{ inputs.days }}
      - name: Commit
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add data/history config
          git diff --cached --quiet || git commit -m "Insider purchases $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
