name: Model Book

on:
  schedule:
    # 03:00 UTC on the 3rd of each month (after the universe refresh on the 1st)
    - cron: "0 3 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs-engine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python modelbook.py
      - name: Commit model book
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add -A docs/modelbook docs/data/modelbook.csv
          git diff --cached --quiet || git commit -m "Model book $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -X theirs
          git push
