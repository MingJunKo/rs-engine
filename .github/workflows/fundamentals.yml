name: Fundamentals

on:
  schedule:
    # Tue + Fri 19:30 UTC (3:30am SGT Wed/Sat) — finishes before the 22:30 UTC RS Engine run.
    # Only stale names are refreshed (RS 70+ weekly, the rest every 3 weeks, or after a new report).
    - cron: "30 19 * * 2,5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Only these tickers (space separated, blank = all stale)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rs-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fundamentals.py ${{ inputs.tickers }}
      - name: Commit
        run: |
          git config user.name "rs-engine-bot"
          git config user.email "rs-engine-bot@users.noreply.github.com"
          git add data/fundamentals.json
          git diff --cached --quiet || git commit -m "Fundamentals $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
